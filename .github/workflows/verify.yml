name: Verify research materials

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_reproduction:
        description: Replay saved models, refit candidates and regenerate engineering calculations
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify distribution integrity
        run: python scripts/manifest.py --check
      - name: Verify archived calculations and data
        run: python scripts/verify.py --json verification/ci-stdlib-results.json

  full-reproduction:
    if: github.event_name == 'workflow_dispatch' && inputs.full_reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install recorded scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Replay models and regenerate numerical study
        run: python scripts/verify.py --refit --regenerate-engineering --json verification/ci-full-results.json
